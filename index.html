<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List · MC88</title>
<style>
  /* ============ base & paper look ============ */
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color:#EAE6E0;
    color:#2C2C2C;
    -webkit-font-smoothing:antialiased;
    transition:background-color .3s ease;
  }

  .app{
    width:min(560px,100%);
    background:#FFFFFF;
    border-radius:4px;
    padding:38px 32px 24px;
    box-shadow:0 4px 20px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.02);
    position:relative;
    transition:width .3s cubic-bezier(.4,0,.2,1), padding .3s ease,
               border-radius .3s ease, background .3s ease, box-shadow .3s ease,
               transform .3s ease, border-color .3s ease, color .3s ease;
  }

  /* ============ mode switcher ============ */
  .mode-switch{
    position:absolute;
    top:14px;
    right:14px;
    display:flex;
    gap:2px;
    padding:3px;
    border-radius:9px;
    background:rgba(0,0,0,.045);
    z-index:5;
  }
  .mode-switch button{
    width:27px;
    height:27px;
    padding:0;
    border:0;
    background:transparent;
    border-radius:7px;
    cursor:pointer;
    display:grid;
    place-items:center;
    color:#9AA0B0;
    transition:background .15s, color .15s;
  }
  .mode-switch button svg{
    width:15px;height:15px;
    fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .mode-switch button:hover{color:#4A4A4A;background:rgba(0,0,0,.06)}
  .mode-switch button.active{background:#fff;color:#2C2C2C;box-shadow:0 1px 3px rgba(0,0,0,.14)}

  /* ============ header ============ */
  .head{
    text-align:center;
    margin-bottom:34px;
    padding:0 84px;
    transition:padding .3s ease, margin .3s ease;
  }
  h1{
    margin:0;
    font-family:Georgia, "Times New Roman", Times, serif;
    font-size:1.85rem;
    font-weight:700;
    letter-spacing:2.5px;
    color:#1A1A1A;
    text-transform:uppercase;
    transition:font-size .3s ease, color .3s ease, letter-spacing .3s ease;
  }

  /* ============ add row ============ */
  .add-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:2px;
    padding:12px 0;
    border-bottom:1px solid #D1D1D1;
    transition:border-color .3s ease, padding .3s ease;
  }
  .fake-box{
    flex:0 0 20px;
    width:20px;
    height:20px;
    border:1.5px solid #B0B0B0;
    border-radius:3px;
    background:#FAFAFA;
    transition:.3s ease;
  }
  #input{
    flex:1;
    min-width:0;
    border:0;
    background:transparent;
    font-family:inherit;
    font-size:1rem;
    color:#2C2C2C;
    outline:none;
    padding:2px 0;
    transition:color .3s ease, font-size .3s ease;
  }
  #input::placeholder{color:#B0B0B0;transition:color .3s ease}
  .add-btn{
    border:0;
    background:transparent;
    color:#2C2C2C;
    font-family:inherit;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    padding:4px 0;
    transition:opacity .15s, color .3s ease, font-size .3s ease;
  }
  .add-btn:hover{opacity:.6}

  /* ============ list ============ */
  .list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid #D1D1D1;
    transition:background .15s, border-color .3s ease, padding .3s ease, gap .3s ease;
  }
  .item:hover{background:#FCFCFC}

  .check{
    flex:0 0 20px;
    width:20px;
    height:20px;
    border:1.5px solid #B0B0B0;
    border-radius:3px;
    background:#FAFAFA;
    cursor:pointer;
    display:grid;
    place-items:center;
    padding:0;
    transition:border-color .15s, background .15s, border-radius .3s ease;
  }
  .check:hover{border-color:#888}
  .check svg{
    width:12px;height:12px;
    fill:none;stroke:#FFF;stroke-width:3.5;
    stroke-linecap:round;stroke-linejoin:round;
    opacity:0;transform:scale(.5);
    transition:.15s;
  }
  .item.done .check{background:#2C2C2C;border-color:#2C2C2C}
  .item.done .check svg{opacity:1;transform:scale(1)}

  .text{
    flex:1;
    min-width:0;
    font-size:1rem;
    line-height:1.5;
    word-break:break-word;
    transition:color .2s, font-size .3s ease;
  }
  .item.done .text{
    color:#A0A0A0;
    text-decoration:line-through;
    text-decoration-color:#C0C0C0;
  }

  .actions{
    display:flex;
    gap:6px;
    opacity:0;
    transition:opacity .15s;
  }
  .item:hover .actions,
  .item:focus-within .actions{opacity:1}
  @media (hover:none){.actions{opacity:1}}

  .icon{
    width:26px;height:26px;
    display:grid;place-items:center;
    border:0;background:transparent;
    border-radius:4px;cursor:pointer;
    color:#A0A0A0;
    transition:.15s;
    padding:0;
  }
  .icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon:hover{color:#2C2C2C;background:#F0F0F0}
  .icon.del:hover{color:#D9534F;background:#FDECEA}

  .edit-input{
    flex:1;
    min-width:0;
    font-family:inherit;
    font-size:1rem;
    color:#2C2C2C;
    background:#F5F5F5;
    border:1px solid #2C2C2C;
    border-radius:4px;
    padding:4px 8px;
    outline:none;
  }

  .empty{
    text-align:center;
    padding:36px 12px;
    color:#B0B0B0;
    font-size:.95rem;
    border-bottom:1px solid #D1D1D1;
    list-style:none;
    transition:color .3s ease, border-color .3s ease;
  }

  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .item.new{animation:fadeIn .28s cubic-bezier(.34,1.4,.64,1)}

  /* ============ progress & footer ============ */
  .progress{
    height:2px;
    background:#E8E8E8;
    margin:22px 0 16px;
    border-radius:2px;
    overflow:hidden;
    transition:margin .3s ease, background .3s ease;
  }
  .bar{
    height:100%;
    width:0;
    background:#2C2C2C;
    transition:width .3s ease, background .3s ease;
  }

  .filters{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:16px;
    transition:gap .3s ease, margin .3s ease;
  }
  .filter{
    border:0;
    background:transparent;
    font-family:inherit;
    font-size:.82rem;
    color:#A0A0A0;
    cursor:pointer;
    padding:4px 0;
    letter-spacing:.3px;
    transition:.15s;
    position:relative;
  }
  .filter:hover{color:#2C2C2C}
  .filter.active{color:#1A1A1A;font-weight:600}
  .filter.active::after{
    content:'';
    position:absolute;
    bottom:-2px;left:0;right:0;
    height:1.5px;
    background:#2C2C2C;
    transition:background .3s ease;
  }

  .foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:.82rem;
    color:#A0A0A0;
    padding-top:4px;
    transition:color .3s ease, font-size .3s ease;
  }
  .clear{
    border:0;
    background:transparent;
    font-family:inherit;
    font-size:.82rem;
    color:#A0A0A0;
    cursor:pointer;
    padding:4px 0;
    transition:.15s;
  }
  .clear:hover:not(:disabled){color:#D9534F}
  .clear:disabled{opacity:.3;cursor:default}

  .copy{
    margin-top:28px;
    padding-top:16px;
    border-top:1px solid #E8E8E8;
    text-align:center;
    font-size:.72rem;
    color:#B0B0B0;
    letter-spacing:.2px;
    transition:color .3s ease, border-color .3s ease, margin .3s ease, font-size .3s ease;
  }
  .copy a{color:#888;text-decoration:none}
  .copy a:hover{text-decoration:underline}

  /* ==========================================================
     MODE : STICKY NOTE
     ========================================================== */
  body.mode-sticky{
    background:#26241F;
    background-image:
      radial-gradient(circle at 25% 15%, rgba(255,255,255,.05), transparent 55%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,.35), transparent 60%);
  }
  .app.mode-sticky{
    width:min(400px,100%);
    background:#FDF3A9;
    background-image:linear-gradient(160deg,#FEF6B8,#FBE98B);
    border:0;
    border-radius:2px;
    padding:44px 26px 18px;
    color:#3D3722;
    transform:rotate(-1.3deg);
    box-shadow:0 26px 50px -18px rgba(0,0,0,.75), 0 4px 12px rgba(0,0,0,.3);
    font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  }
  .app.mode-sticky::before{
    content:'';
    position:absolute;
    top:-11px;left:50%;
    width:120px;height:26px;
    transform:translateX(-50%) rotate(-2.5deg);
    background:rgba(255,255,255,.62);
    box-shadow:0 1px 4px rgba(0,0,0,.18);
    border-radius:1px;
    pointer-events:none;
  }
  .app.mode-sticky .mode-switch{background:rgba(61,55,34,.09)}
  .app.mode-sticky .mode-switch button{color:#8A7F4E}
  .app.mode-sticky .mode-switch button:hover{color:#3D3722;background:rgba(61,55,34,.12)}
  .app.mode-sticky .mode-switch button.active{background:#3D3722;color:#FDF3A9;box-shadow:none}

  .app.mode-sticky .head{margin-bottom:16px;padding:0 74px}
  .app.mode-sticky h1{
    font-family:inherit;
    font-size:1.5rem;
    letter-spacing:1px;
    text-transform:none;
    color:#3D3722;
  }
  .app.mode-sticky .add-row{border-bottom:1.5px dashed rgba(61,55,34,.28)}
  .app.mode-sticky .fake-box{
    border:1.5px solid rgba(61,55,34,.45);
    background:transparent;
    border-radius:2px;
  }
  .app.mode-sticky #input{color:#3D3722;font-family:inherit}
  .app.mode-sticky #input::placeholder{color:rgba(61,55,34,.42)}
  .app.mode-sticky .add-btn{color:#3D3722}
  .app.mode-sticky .item{
    border-bottom:1.5px dashed rgba(61,55,34,.22);
    padding:11px 0;
  }
  .app.mode-sticky .item:hover{background:rgba(255,255,255,.32)}
  .app.mode-sticky .check{
    border:1.5px solid rgba(61,55,34,.5);
    background:transparent;
    border-radius:2px;
  }
  .app.mode-sticky .check:hover{border-color:#3D3722}
  .app.mode-sticky .item.done .check{background:#3D3722;border-color:#3D3722}
  .app.mode-sticky .text{color:#3D3722}
  .app.mode-sticky .item.done .text{
    color:rgba(61,55,34,.45);
    text-decoration-color:rgba(61,55,34,.35);
  }
  .app.mode-sticky .progress{display:none}
  .app.mode-sticky .filters{gap:16px;margin-bottom:12px}
  .app.mode-sticky .filter{color:rgba(61,55,34,.5);font-size:.8rem}
  .app.mode-sticky .filter:hover{color:#3D3722}
  .app.mode-sticky .filter.active{color:#3D3722}
  .app.mode-sticky .filter.active::after{background:#3D3722}
  .app.mode-sticky .foot{color:rgba(61,55,34,.6);font-size:.78rem}
  .app.mode-sticky .clear{color:rgba(61,55,34,.6);font-size:.78rem}
  .app.mode-sticky .clear:hover:not(:disabled){color:#B91C1C}
  .app.mode-sticky .copy{
    color:rgba(61,55,34,.45);
    border-top:1px solid rgba(61,55,34,.15);
    margin-top:18px;
    padding-top:12px;
    font-size:.68rem;
  }
  .app.mode-sticky .copy a{color:rgba(61,55,34,.65)}
  .app.mode-sticky .icon{color:rgba(61,55,34,.45)}
  .app.mode-sticky .icon:hover{color:#3D3722;background:rgba(61,55,34,.12)}
  .app.mode-sticky .icon.del:hover{color:#B91C1C;background:rgba(185,28,28,.12)}
  .app.mode-sticky .empty{
    color:rgba(61,55,34,.5);
    border-bottom:1.5px dashed rgba(61,55,34,.2);
    padding:28px 8px;
  }
  .app.mode-sticky .edit-input{
    background:rgba(255,255,255,.55);
    border:1px solid #3D3722;
    color:#3D3722;
    font-family:inherit;
  }

  /* ==========================================================
     MODE : WIDGET
     ========================================================== */
  body.mode-widget{
    background:#0B0D12;
    background-image:
      radial-gradient(600px 420px at 15% -10%, rgba(99,102,241,.22), transparent 60%),
      radial-gradient(500px 380px at 110% 110%, rgba(14,165,233,.16), transparent 60%);
  }
  .app.mode-widget{
    width:min(360px,100%);
    background:rgba(24,27,36,.93);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:20px 20px 14px;
    color:#E8EAF0;
    box-shadow:0 30px 60px -24px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    transform:rotate(0deg);
  }
  .app.mode-widget .mode-switch{background:rgba(255,255,255,.06);top:12px;right:12px}
  .app.mode-widget .mode-switch button{color:#79809A}
  .app.mode-widget .mode-switch button:hover{color:#E8EAF0;background:rgba(255,255,255,.10)}
  .app.mode-widget .mode-switch button.active{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}

  .app.mode-widget .head{
    text-align:left;
    margin-bottom:14px;
    padding:0 96px 0 0;
  }
  .app.mode-widget h1{
    font-family:inherit;
    font-size:.95rem;
    font-weight:600;
    letter-spacing:.4px;
    text-transform:none;
    color:#FFFFFF;
  }
  .app.mode-widget .add-row{
    border-bottom:1px solid rgba(255,255,255,.09);
    padding:10px 0;
    gap:10px;
  }
  .app.mode-widget .fake-box{
    border:1.5px solid rgba(255,255,255,.22);
    background:transparent;
    border-radius:50%;
    flex:0 0 18px;width:18px;height:18px;
  }
  .app.mode-widget #input{color:#fff;font-size:.9rem}
  .app.mode-widget #input::placeholder{color:#5A6274}
  .app.mode-widget .add-btn{color:#A5B4FC;font-size:.9rem}

  .app.mode-widget .item{
    border-bottom:0;
    padding:9px 8px;
    gap:11px;
    border-radius:9px;
  }
  .app.mode-widget .item:hover{background:rgba(255,255,255,.05)}
  .app.mode-widget .check{
    border:1.5px solid rgba(255,255,255,.28);
    background:transparent;
    border-radius:50%;
    flex:0 0 18px;width:18px;height:18px;
  }
  .app.mode-widget .check:hover{border-color:#A5B4FC}
  .app.mode-widget .item.done .check{background:#6366F1;border-color:#6366F1}
  .app.mode-widget .text{font-size:.9rem}
  .app.mode-widget .item.done .text{
    color:#6B7280;
    text-decoration-color:#4B5563;
  }
  .app.mode-widget .icon{color:#6B7280;width:24px;height:24px}
  .app.mode-widget .icon:hover{color:#fff;background:rgba(255,255,255,.10)}
  .app.mode-widget .icon.del:hover{color:#F87171;background:rgba(248,113,113,.14)}
  .app.mode-widget .progress{display:none}
  .app.mode-widget .filters{gap:14px;margin-bottom:10px}
  .app.mode-widget .filter{color:#6B7280;font-size:.75rem}
  .app.mode-widget .filter:hover{color:#E8EAF0}
  .app.mode-widget .filter.active{color:#fff;font-weight:600}
  .app.mode-widget .filter.active::after{background:#6366F1}
  .app.mode-widget .foot{color:#6B7280;font-size:.74rem}
  .app.mode-widget .clear{color:#6B7280;font-size:.74rem}
  .app.mode-widget .clear:hover:not(:disabled){color:#F87171}
  .app.mode-widget .empty{
    color:#5A6274;
    border-bottom:0;
    padding:26px 8px;
    font-size:.85rem;
  }
  .app.mode-widget .copy{
    color:#4B5563;
    border-top:1px solid rgba(255,255,255,.07);
    margin-top:16px;
    padding-top:12px;
    font-size:.66rem;
  }
  .app.mode-widget .copy a{color:#6B7280}
  .app.mode-widget .edit-input{
    background:rgba(255,255,255,.08);
    border:1px solid #6366F1;
    color:#fff;
    font-size:.9rem;
  }

  /* ============ responsive ============ */
  @media (max-width:420px){
    .app{padding:32px 20px 18px}
    .head{padding:0 68px}
    h1{font-size:1.35rem;letter-spacing:1.5px}
    .app.mode-sticky{padding:40px 20px 16px}
    .app.mode-sticky .head{padding:0 62px}
    .app.mode-sticky h1{font-size:1.25rem}
    .app.mode-widget{padding:18px 16px 12px}
    .app.mode-widget .head{padding-right:90px}
  }
</style>
</head>
<body class="mode-list">

<main class="app mode-list" id="app">
  <!-- view switcher -->
  <div class="mode-switch" id="modeSwitch" role="group" aria-label="View mode">
    <button type="button" data-mode="list" class="active" title="List view" aria-label="List view">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    </button>
    <button type="button" data-mode="sticky" title="Sticky note" aria-label="Sticky note view">
      <svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v9l-5 5H5a1 1 0 0 1-1-1V5Z"/><path d="M15 19v-5h5"/></svg>
    </button>
    <button type="button" data-mode="widget" title="Widget" aria-label="Widget view">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M3 10h18"/></svg>
    </button>
  </div>

  <header class="head">
    <h1>To Do List</h1>
  </header>

  <form class="add-row" id="addForm" autocomplete="off">
    <div class="fake-box" aria-hidden="true"></div>
    <input id="input" type="text" maxlength="200" placeholder="Add a new task..." aria-label="New task">
    <button class="add-btn" type="submit">Add</button>
  </form>

  <ul class="list" id="list"></ul>

  <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>

  <nav class="filters" id="filters" aria-label="Filters">
    <button class="filter active" type="button" data-filter="all">All</button>
    <button class="filter" type="button" data-filter="active">Active</button>
    <button class="filter" type="button" data-filter="completed">Done</button>
  </nav>

  <footer class="foot">
    <span id="left">0 items left</span>
    <button class="clear" id="clear" type="button">Clear completed</button>
  </footer>

  <div class="copy">
    © <span id="year"></span> <a href="mailto:mohamed005cheikh@gmail.com">mohamed005cheikh@gmail.com</a> | by MC88
  </div>
</main>

<script>
(function () {
  'use strict';

  /* ============ keys ============ */
  const STORAGE_KEY = 'mc88.todos.v1';
  const MODE_KEY    = 'mc88.mode.v1';
  const MODES       = ['list', 'sticky', 'widget'];

  const $ = (sel) => document.querySelector(sel);

  const appEl     = $('#app');
  const listEl    = $('#list');
  const inputEl   = $('#input');
  const formEl    = $('#addForm');
  const barEl     = $('#bar');
  const leftEl    = $('#left');
  const clearEl   = $('#clear');
  const filtersEl = $('#filters');
  const switchEl  = $('#modeSwitch');

  let todos  = loadTodos();
  let filter = 'all';
  let lastAddedId = null;

  /* ============ storage ============ */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const data = JSON.parse(raw);
      if (!Array.isArray(data)) return [];
      return data
        .filter((t) => t && typeof t.text === 'string' && t.text.trim() !== '')
        .map((t) => ({
          id: String(t.id || uid()),
          text: t.text,
          done: !!t.done,
          createdAt: Number(t.createdAt) || Date.now()
        }));
    } catch (e) { return []; }
  }

  function saveTodos() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }
    catch (e) { /* ignore */ }
  }

  function loadMode() {
    try {
      const m = localStorage.getItem(MODE_KEY);
      return MODES.includes(m) ? m : 'list';
    } catch (e) { return 'list'; }
  }

  function saveMode(m) {
    try { localStorage.setItem(MODE_KEY, m); } catch (e) { /* ignore */ }
  }

  /* ============ actions ============ */
  function addTodo(text) {
    const value = text.trim();
    if (!value) return;
    const todo = { id: uid(), text: value, done: false, createdAt: Date.now() };
    todos.unshift(todo);
    lastAddedId = todo.id;
    saveTodos();
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find((t) => t.id === id);
    if (!todo) return;
    todo.done = !todo.done;
    saveTodos();
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter((t) => t.id !== id);
    saveTodos();
    render();
  }

  function updateTodo(id, text) {
    const todo = todos.find((t) => t.id === id);
    if (!todo) return;
    const value = text.trim();
    if (!value) { deleteTodo(id); return; }
    todo.text = value;
    saveTodos();
    render();
  }

  function clearCompleted() {
    todos = todos.filter((t) => !t.done);
    saveTodos();
    render();
  }

  /* ============ inline edit ============ */
  function startEdit(li, id) {
    if (!li || li.querySelector('.edit-input')) return;
    const todo = todos.find((t) => t.id === id);
    if (!todo) return;

    const span = li.querySelector('.text');
    if (!span) return;

    const editor = document.createElement('input');
    editor.type = 'text';
    editor.className = 'edit-input';
    editor.value = todo.text;
    editor.maxLength = 200;
    editor.setAttribute('aria-label', 'Edit task');

    li.replaceChild(editor, span);
    editor.focus();
    editor.setSelectionRange(editor.value.length, editor.value.length);

    let finished = false;
    const commit = () => {
      if (finished) return; finished = true;
      updateTodo(id, editor.value);
    };
    const cancel = () => {
      if (finished) return; finished = true;
      render();
    };

    editor.addEventListener('blur', commit);
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
  }

  /* ============ render ============ */
  const PENCIL = '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>';
  const TRASH  = '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>';

  function createIconButton(action, label, svgPath, extraClass) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon' + (extraClass ? ' ' + extraClass : '');
    btn.dataset.action = action;
    btn.setAttribute('aria-label', label);
    btn.title = label;
    btn.innerHTML = '<svg viewBox="0 0 24 24">' + svgPath + '</svg>';
    return btn;
  }

  function render() {
    const activeCount    = todos.filter((t) => !t.done).length;
    const completedCount = todos.length - activeCount;

    const visible = todos.filter((t) => {
      if (filter === 'active') return !t.done;
      if (filter === 'completed') return t.done;
      return true;
    });

    listEl.innerHTML = '';

    if (visible.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent =
        todos.length === 0
          ? 'Your list is empty — add a task above.'
          : filter === 'active'
            ? 'No active tasks. Great job!'
            : 'No completed tasks yet.';
      listEl.appendChild(li);
    } else {
      const frag = document.createDocumentFragment();

      visible.forEach((todo) => {
        const li = document.createElement('li');
        li.className = 'item' + (todo.done ? ' done' : '') + (todo.id === lastAddedId ? ' new' : '');
        li.dataset.id = todo.id;

        const check = document.createElement('button');
        check.type = 'button';
        check.className = 'check';
        check.dataset.action = 'toggle';
        check.setAttribute('aria-label', todo.done ? 'Mark as active' : 'Mark as done');
        check.title = todo.done ? 'Mark as active' : 'Mark as done';
        check.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';

        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = todo.text;
        span.title = 'Double-click to edit';

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.appendChild(createIconButton('edit', 'Edit task', PENCIL));
        actions.appendChild(createIconButton('delete', 'Delete task', TRASH, 'del'));

        li.append(check, span, actions);
        frag.appendChild(li);
      });

      listEl.appendChild(frag);
    }

    lastAddedId = null;

    leftEl.textContent = activeCount + (activeCount === 1 ? ' item left' : ' items left');

    const pct = todos.length ? (completedCount / todos.length) * 100 : 0;
    barEl.style.width = pct + '%';

    clearEl.disabled = completedCount === 0;
  }

  /* ============ mode ============ */
  function applyMode(mode, animate) {
    const m = MODES.includes(mode) ? mode : 'list';

    if (animate === false) {
      appEl.style.transition = 'none';
      document.body.style.transition = 'none';
    }

    document.body.className = 'mode-' + m;
    appEl.className = 'app mode-' + m;

    switchEl.querySelectorAll('button').forEach((b) => {
      b.classList.toggle('active', b.dataset.mode === m);
    });

    saveMode(m);

    if (animate === false) {
      // force reflow, then restore transitions
      void appEl.offsetWidth;
      appEl.style.transition = '';
      document.body.style.transition = '';
    }
  }

  switchEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-mode]');
    if (!btn) return;
    applyMode(btn.dataset.mode, true);
  });

  /* ============ events ============ */
  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    addTodo(inputEl.value);
    inputEl.value = '';
    inputEl.focus();
  });

  listEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const li = btn.closest('.item');
    if (!li) return;

    const id = li.dataset.id;
    const action = btn.dataset.action;

    if (action === 'toggle') toggleTodo(id);
    else if (action === 'delete') deleteTodo(id);
    else if (action === 'edit') startEdit(li, id);
  });

  listEl.addEventListener('dblclick', (e) => {
    const span = e.target.closest('.text');
    if (!span) return;
    const li = span.closest('.item');
    if (li) startEdit(li, li.dataset.id);
  });

  filtersEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-filter]');
    if (!btn) return;
    filter = btn.dataset.filter;
    filtersEl.querySelectorAll('.filter').forEach((b) => {
      b.classList.toggle('active', b === btn);
    });
    render();
  });

  clearEl.addEventListener('click', clearCompleted);

  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY) {
      todos = loadTodos();
      render();
    } else if (e.key === MODE_KEY) {
      applyMode(loadMode(), true);
    }
  });

  /* ============ init ============ */
  (function init() {
    $('#year').textContent = new Date().getFullYear();

    applyMode(loadMode(), false);
    render();
    inputEl.focus();
  })();
})();
</script>
</body>
</html>
